<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>พุทธศาสนสถานและพุทธศิลป์ — พระพุทธศาสนา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@400;500;600;700&family=Noto+Sans+Thai:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="scroll-progress" id="scrollProgress"></div>
<div id="navbar-root"></div>

<div id="page-header-root"
     data-category="พิพิธภัณฑ์ดิจิทัล"
     data-title="พุทธศาสนสถานและพุทธศิลป์"
     data-desc="รวบรวมสถานที่และงานพุทธศิลป์สำคัญ">
</div>

<!-- ===================================================== FEATURED SITE -->
<section class="section">
  <div class="container">
    <div class="eyebrow reveal">สถานที่แนะนำ</div>
    <div id="featured-site"></div>
  </div>
</section>

<!-- ==================================================== IMAGE GALLERY -->
<section class="section section--cream">
  <div class="container">
    <div class="section-head reveal">
      <div><div class="eyebrow">คลังภาพ</div><h2>แกลเลอรีพุทธศิลป์</h2></div>
      <p style="margin:0;max-width:32ch;">คลิกที่ภาพเพื่อดูรายละเอียดของแต่ละสถานที่</p>
    </div>
    <div id="site-gallery"></div>
  </div>
</section>

<!-- =================================================== LOCATION CARDS -->
<section class="section">
  <div class="container">
    <div class="section-head reveal">
      <div><div class="eyebrow">รายการทั้งหมด</div><h2>พุทธศาสนสถานสำคัญ</h2></div>
    </div>
    <div id="location-cards"></div>
  </div>
</section>

<!-- ============================================================== CTA -->
<section class="section">
  <div class="container">
    <div class="cta-band reveal">
      <div>
        <h2>เริ่มต้นเรียนรู้พระพุทธศาสนาไปด้วยกัน</h2>
        <p>สำรวจเนื้อหาเพิ่มเติมในเว็บไซต์</p>
      </div>
      <a href="index.html" class="btn btn-outline" style="border-color:rgba(248,244,234,.4);color:var(--ivory);">หน้าหลัก</a>
    </div>
  </div>
</section>

<div id="footer-root"></div>
<button class="back-to-top" id="backToTop" aria-label="กลับขึ้นด้านบน">↑</button>

<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script>
  insertNavbar("sacred-sites");
  insertFooter();
  insertPageHeader();
  window.__modalSites = sacredSites;
  renderFeaturedSite("featured-site", sacredSites.find(s => s.featured) || sacredSites[0]);
  renderGallery("site-gallery", sacredSites);
  renderLocationCards("location-cards", sacredSites);
</script>
<script src="js/main.js"></script>
</body>
</html>
